name: Auto Blog Generator

on:
  # This runs the action automatically on a schedule
  schedule:
    # 0 0 */3 * * means: At 00:00 (midnight UTC) on every 3rd day-of-month.
    - cron: '0 0 */3 * *'
  
  # This allows you to manually trigger the workflow from the Actions tab
  workflow_dispatch:

jobs:
  generate-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Blog Generation Script
        run: node scripts/generate-blog.mjs
        env:
          # We securely inject the secrets you saved in GitHub Settings
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          NEXT_PUBLIC_R2_DEV_URL: ${{ secrets.NEXT_PUBLIC_R2_DEV_URL }}
