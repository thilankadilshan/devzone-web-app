version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Map the current directory to /app in the container for live reloading
      - .:/app
      # Exclude node_modules and .next from the volume mapping so the container uses its own
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    env_file:
      - .env
